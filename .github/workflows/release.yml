name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/dashforge/manifest.json > m.json
          mv m.json custom_components/dashforge/manifest.json
      - name: Build dashforge.zip
        run: |
          cd custom_components/dashforge
          zip -r ../../dashforge.zip . -x "__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: dashforge.zip
